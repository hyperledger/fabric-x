name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install lint utilities
        run: |
          # GOTOOLCHAIN=local forces golangci-lint to be built with the Go
          # toolchain setup-go installed from go.mod. golangci-lint refuses to
          # lint a module targeting a higher Go language version than the one it
          # was built with, so its build toolchain must match the go.mod version.
          GOTOOLCHAIN=local GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          "$(go env GOPATH)/bin/golangci-lint" --version

      - name: Run lint
        run: |
          git fetch origin main:refs/remotes/origin/main
          make lint
